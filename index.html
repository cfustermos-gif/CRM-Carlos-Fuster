<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Inmobiliario · Carlos Fuster</title>
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d1f'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='700' font-size='24' fill='white' text-anchor='middle'%3ECF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#fbfbfd; --elev:rgba(255,255,255,.72);
  --ink:#1d1d1f; --ink-2:#424245; --ink-3:#6e6e73; --ink-4:#a1a1a6;
  --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.05);
  --accent:#0071e3; --accent-soft:rgba(0,113,227,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#1a8f3c; --warn:#c77700; --bad:#d70015; --neutral:#8e8e93;
  --sea:#d6e6f5; --land:#fbfbfa; --land-hi:#ffffff; --land-stroke:#e2e2e0;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --shadow-lg:0 2px 6px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.14);
  --r:18px; --r-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --surface:#1c1c1e; --surface-2:#232325; --elev:rgba(28,28,30,.78);
  --ink:#f5f5f7; --ink-2:#d2d2d7; --ink-3:#98989d; --ink-4:#636366;
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.06);
  --accent:#2997ff; --accent-soft:rgba(41,151,255,.16);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#30d158; --warn:#ff9f0a; --bad:#ff453a; --neutral:#8e8e93;
  --sea:#0a1520; --land:#1c1c1e; --land-hi:#232325; --land-stroke:#2f2f31;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
/* Sidebar */
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--elev);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1d1d1f,#4a4a4f);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.02em}
:root[data-theme="dark"] .brand .logo{background:linear-gradient(135deg,#f5f5f7,#c7c7cc);color:#000}
.brand b{display:block;font-size:14px;font-weight:600}
.brand span{font-size:12px;color:var(--ink-3)}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink-2);font-weight:500;border:0;background:none;text-align:left;width:100%}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:var(--line-2)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:500}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px}
.sync{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--neutral);display:inline-block;flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
/* Main */
main{min-width:0;padding:28px 36px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:0}
.head p{margin:6px 0 0;color:var(--ink-3);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:980px;font-weight:500;font-size:13px;color:var(--ink);transition:transform .12s, background .2s}
.btn:hover{background:var(--surface-2)} .btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line-2)}
.grid{display:grid;gap:16px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{padding:18px 20px}
.tile .lbl{font-size:12.5px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:6px}
.tile .val{font-size:32px;font-weight:700;letter-spacing:-.03em;margin-top:6px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .val small{font-size:15px;font-weight:600;color:var(--ink-3);margin-left:3px;letter-spacing:-.01em}
.tile .sub{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.panel{padding:20px 22px}
.panel h3{margin:0 0 2px;font-size:16px;font-weight:600;letter-spacing:-.015em}
.panel .desc{margin:0 0 14px;font-size:12.5px;color:var(--ink-3)}
.section-t{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:30px 0 12px}
/* Chips / toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:980px;padding:7px 14px;min-width:240px;flex:1;max-width:360px}
.search input{border:0;outline:0;background:transparent;width:100%}
.search svg{width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:2}
.seg{display:inline-flex;background:var(--line-2);border-radius:980px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:980px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:980px;padding:5px 11px;font-size:12px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--surface);border-color:transparent}
.chip .n{opacity:.6}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:980px;padding:6px 12px;font-size:12.5px}
/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:980px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;display:inline-block}
/* Property cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.pcard{overflow:hidden;cursor:pointer;transition:transform .2s ease, box-shadow .2s ease;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.pimg{height:150px;position:relative;display:grid;place-items:center;overflow:hidden}
.pimg svg.ic{width:64px;height:64px;stroke:rgba(255,255,255,.95);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 4px 10px rgba(0,0,0,.15))}
.pimg .tl{position:absolute;left:12px;top:12px}
.pimg .tr{position:absolute;right:12px;top:12px;font-size:11px;color:#fff;background:rgba(0,0,0,.28);backdrop-filter:blur(10px);padding:3px 8px;border-radius:980px;font-weight:600}
.pimg .badge{background:rgba(255,255,255,.88);color:#1d1d1f;backdrop-filter:blur(10px)}
.pbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.pbody .price{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pbody .addr{font-weight:600;font-size:14px}
.pbody .muni{color:var(--ink-3);font-size:12.5px}
.pbody .meta{display:flex;gap:12px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-3)}
.pbody .meta b{color:var(--ink);font-weight:600}
/* Kanban */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{min-width:260px;width:260px;background:var(--line-2);border-radius:var(--r);padding:12px;flex:none}
.col h4{margin:0 0 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.col h4 .n{margin-left:auto;color:var(--ink-3);font-weight:500}
.col.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.kc{background:var(--surface);border-radius:12px;padding:11px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:grab;border:1px solid var(--line-2)}
.kc:active{cursor:grabbing}
.kc b{display:block;font-size:13px;font-weight:600}
.kc span{font-size:12px;color:var(--ink-3)}
.kc .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
/* Contacts */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{padding:16px;cursor:pointer;transition:transform .2s, box-shadow .2s;display:flex;flex-direction:column;gap:10px}
.ccard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.ccard .top{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;flex:none;letter-spacing:.02em}
.ccard .nm{font-weight:600;font-size:14px;line-height:1.2}
.ccard .co{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.ccard .ln{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .ln svg{width:13px;height:13px;stroke:var(--ink-3);fill:none;stroke-width:1.8;flex:none}
.ccard .tags{display:flex;gap:6px;flex-wrap:wrap}
.more{display:flex;justify-content:center;margin:20px 0}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:12px;right:12px;bottom:12px;width:min(560px,calc(100vw - 24px));background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);z-index:41;transform:translateX(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
.sheet.on{transform:none}
.sheet .sh-head{padding:18px 22px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:flex-start;gap:12px}
.sheet .sh-head h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sheet .sh-head p{margin:3px 0 0;color:var(--ink-3);font-size:13px}
.sheet .x{margin-left:auto;border:0;background:var(--line-2);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.sheet .x svg{width:14px;height:14px;stroke:var(--ink-2);stroke-width:2.2;fill:none}
.sheet .sh-body{padding:18px 22px 28px;overflow:auto;flex:1}
.sheet .sh-foot{padding:12px 22px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hero{height:170px;border-radius:16px;display:grid;place-items:center;margin-bottom:18px;position:relative;overflow:hidden}
.hero svg.ic{width:76px;height:76px;stroke:rgba(255,255,255,.95);fill:none;stroke-width:1.2}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.kv div{background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px}
.kv span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500}
.kv b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.grp{margin-bottom:20px}
.grp h5{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.list{background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px}
.list .it{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line-2);font-size:13.5px}
.list .it:last-child{border-bottom:0}
.list .it span{color:var(--ink-3)}
.list .it b{font-weight:500;text-align:right}
.notes{background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:12px;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap}
.tline{position:relative;padding-left:22px}
.tline:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tline .ev{position:relative;padding:4px 0 12px}
.tline .ev:before{content:"";position:absolute;left:-20px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tline .ev.done:before{background:var(--accent)}
.tline .ev b{font-size:13.5px;font-weight:600} .tline .ev span{display:block;font-size:12px;color:var(--ink-3)}
/* Forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-3);font-weight:500}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:14px;color:var(--ink);outline:none}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.form textarea{min-height:90px;resize:vertical}
/* Charts */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:150px 1fr 54px;align-items:center;gap:10px;font-size:12.5px;position:relative}
.bar .t{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:22px;position:relative}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.bar:hover .fill{filter:brightness(1.08)}
.funnel .fill{border-radius:4px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-lg);border-radius:10px;padding:8px 10px;font-size:12px;opacity:0;transition:opacity .12s;max-width:260px}
.tip.on{opacity:1}
.tip b{display:block;font-size:12.5px}
.ring{display:flex;align-items:center;gap:18px}
.ring svg{flex:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.alerts .al{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.alerts .al:last-child{border-bottom:0}
.alerts .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:15px}
.alerts .al b{font-size:13.5px;font-weight:600;display:block}
.alerts .al span{font-size:12px;color:var(--ink-3)}
.empty{padding:28px;text-align:center;color:var(--ink-3);font-size:13px}
/* Fotos */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.th{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--line-2)}
.th img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.th.cover{outline:2.5px solid var(--accent);outline-offset:-2.5px}
.th .cv{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:600;background:var(--accent);color:#fff;padding:2px 7px;border-radius:980px}
.th .tha{position:absolute;right:5px;top:5px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.th:hover .tha{opacity:1}
@media (hover:none){.th .tha{opacity:1}}
.th .tha button{border:0;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;backdrop-filter:blur(6px)}
.dropz{display:flex;gap:12px;align-items:center;justify-content:center;padding:22px;border:1.5px dashed var(--line);border-radius:14px;color:var(--ink-3);cursor:pointer;text-align:center;font-size:13px}
.dropz:hover{border-color:var(--accent);color:var(--accent)}
.dropz svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:grid;place-items:center}
.lb img{max-width:94vw;max-height:88vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px;backdrop-filter:blur(8px)}
.lbx{top:16px;right:16px}.lbp{left:16px;top:50%;transform:translateY(-50%)}.lbn{right:16px;top:50%;transform:translateY(-50%)}
.lbc{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;opacity:.8}
.fsec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600;padding-top:10px;border-top:1px solid var(--line-2);margin-top:4px}
.fsec:first-child{border-top:0;padding-top:0;margin-top:0}
.av{background-color:var(--line)}
/* Map */
.mapwrap{display:grid;grid-template-columns:1fr 360px;gap:16px;height:calc(100vh - 150px);min-height:560px}
.mapcard{position:relative;overflow:hidden;background:var(--sea)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#map.adding{cursor:crosshair}
#map .cp{fill:var(--land);stroke:var(--land-stroke);stroke-width:.6;vector-effect:non-scaling-stroke}
#map .cp.hi{fill:var(--land-hi)}
#map .town{font-weight:600;fill:var(--ink-3);opacity:.85;paint-order:stroke;stroke:var(--land);stroke-width:3px;letter-spacing:.02em;pointer-events:none;text-transform:uppercase}
#map .pin{cursor:pointer}
#map .pin circle.b{stroke:var(--surface);stroke-width:2.5}
#map .pin:hover circle.b{stroke-width:3.5}
#map .pin text{font-weight:700;fill:#fff;pointer-events:none;text-anchor:middle;dominant-baseline:central}
#map .route{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:6 5;vector-effect:non-scaling-stroke;opacity:.75}
.mapui{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:8px;z-index:3}
.glass{background:var(--elev);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.layers{padding:8px;display:flex;flex-direction:column;gap:2px}
.layer{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:7px 10px;border-radius:9px;font-size:13px;font-weight:500;text-align:left}
.layer:hover{background:var(--line-2)}
.layer .sw{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:12px;flex:none}
.layer.off{opacity:.45}
.layer .n{margin-left:auto;color:var(--ink-3);font-size:12px;padding-left:14px}
.zones{position:absolute;left:14px;bottom:14px;padding:4px;display:flex;gap:2px;z-index:3;max-width:calc(100% - 80px);overflow-x:auto}
.zones button{border:0;background:transparent;padding:6px 11px;border-radius:10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.zones button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.zoomc{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;z-index:3;overflow:hidden}
.zoomc button{border:0;background:transparent;width:36px;height:36px;font-size:18px;font-weight:500}
.zoomc button+button{border-top:1px solid var(--line)}
.pop{position:absolute;z-index:5;width:270px;padding:14px;transform:translate(-50%,calc(-100% - 18px));display:none}
.pop.on{display:block}
.pop h4{margin:0;font-size:14px;font-weight:600;line-height:1.25}
.pop p{margin:4px 0 10px;font-size:12px;color:var(--ink-3)}
.pop .acts{display:flex;gap:6px;flex-wrap:wrap}
.route-panel{display:flex;flex-direction:column;overflow:hidden}
.route-panel .rp-head{padding:16px 18px 12px;border-bottom:1px solid var(--line-2)}
.route-panel .rp-head h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.015em}
.route-panel .rp-body{flex:1;overflow:auto;padding:10px 12px}
.route-panel .rp-foot{padding:12px 14px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px}
.stop{border:1px solid var(--line-2);background:var(--surface-2);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.stop .sh{display:flex;gap:10px;align-items:flex-start}
.stop .num{width:24px;height:24px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.stop .ti{font-weight:600;font-size:13px;line-height:1.25}
.stop .ad{font-size:11.5px;color:var(--ink-3)}
.stop .ctl{margin-left:auto;display:flex;gap:2px}
.stop .ctl button{border:0;background:transparent;width:24px;height:24px;border-radius:6px;color:var(--ink-3);font-size:13px}
.stop .ctl button:hover{background:var(--line-2);color:var(--ink)}
.stop.done{opacity:.6}
.stop.done .ti{text-decoration:line-through}
.tasks{margin:8px 0 0 34px;display:flex;flex-direction:column;gap:4px}
.task{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2)}
.task input{margin-top:2px;accent-color:var(--accent)}
.task.ok span{text-decoration:line-through;color:var(--ink-4)}
.addtask{margin:6px 0 0 34px;display:flex;gap:6px}
.addtask input{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);font-size:12px}
.stat-row{display:flex;gap:10px}
.stat-row div{flex:1;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px}
.stat-row span{display:block;font-size:11px;color:var(--ink-3)}
.stat-row b{font-size:15px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:980px;font-size:13px;font-weight:500;opacity:0;transition:all .25s;z-index:80;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.banner{background:var(--accent-soft);color:var(--ink-2);border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:13px;display:flex;gap:10px;align-items:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:var(--line-2);cursor:pointer}
.mobnav{display:none}
body.login .app{grid-template-columns:1fr}
body.login .mobnav{display:none!important}
@media (max-width:1100px){.k4{grid-template-columns:repeat(2,1fr)}.mapwrap{grid-template-columns:1fr;height:auto}.mapcard{height:62vh}.route-panel{max-height:none}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:18px 16px 96px}
  .head h1{font-size:26px}
  .k2,.k3{grid-template-columns:1fr}
  .bar{grid-template-columns:110px 1fr 46px}
  .zones{max-width:calc(100% - 70px)}
  .mobnav{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:30;justify-content:space-around;padding:6px}
  .mobnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--ink-3);padding:4px 6px}
  .mobnav button.on{color:var(--accent)}
  .mobnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .form{grid-template-columns:1fr}
  .toast{bottom:96px}
  .sheet{top:auto;left:0;right:0;bottom:0;width:100%;height:92vh;border-radius:22px 22px 0 0;transform:translateY(105%)}
}
</style>

function iso(d){ if(!d) return ''; const x = new Date(d); if (isNaN(x)) return ''; return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function pd(s){ if(!s) return null; const [y,m,d] = String(s).slice(0,10).split('-').map(Number); if(!y) return null; return new Date(y,m-1,d||1); }
function addMonthsISO(iso, m){ const d=pd(iso); if(!d) return iso; const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+m); const last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return iso8(d); }
function iso8(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// Prórroga automática: si el encargo ya venció, lo avanza por periodos iguales; calcula la fecha límite de preaviso
function encargoVenc(n){
  if (!n.finEncargo) { n.fechaPreaviso = undefined; return n; }
  const m = +n.prorrogaMeses || 0; const hoy = iso8(new Date());
  if (m>0 && !/^(8|9)\./.test(String(n.estado||''))) { let f=n.finEncargo, k=0; while (f < hoy && k<200) { f=addMonthsISO(f, m); k++; } n.finEncargo=f; }
  const dias = n.preavisoDias!=null ? +n.preavisoDias : (m>0 ? 15 : 0);
  const d = pd(n.finEncargo); if (d && dias>0) { d.setDate(d.getDate()-dias); n.fechaPreaviso = iso8(d); } else n.fechaPreaviso = undefined;
  return n;
}

const writing = {};
async function save(col, obj, opts={}){
  obj = strip(obj);
  if (col!=='fotos') { const i = S[col].findIndex(x=>x.id===obj.id); if (i>=0) S[col][i]=obj; else S[col].push(obj); if (!opts.quiet) scheduleRender(); }
  if (!backend) { toast('Sin conexión: el cambio no se ha guardado'); return; }
  const key = col+'/'+obj.id; const body={...obj}; delete body.id;
  const p = (writing[key] || Promise.resolve()).then(() => backend.set(col, obj.id, body))
    .then(()=>setSync('ok', backend.okTxt))
    .catch(e => { console.error(e); setSync('bad','Error al guardar'); toast(e && (e.code==='quota_exceeded') ? 'Base de datos llena' : 'No se pudo guardar el cambio'); throw e; });
  writing[key]=p.catch(()=>{}); return p;
}

function artifactBackend(db){
  const C = c => db.collection(BASE+'/'+c);

    set: (c,id,b)=>C(c).doc(id).set(b), del: (c,id)=>C(c).doc(id).delete(),
    fotos: async ref => (await C('fotos').where('ref','==',ref).get()).docs.map(d=>({...d.data(), id:d.id})),
    allFotos: async () => (await C('fotos').get()).docs.map(d=>({...d.data(), id:d.id})),
    bulk: async (c, rows, prog) => { for (let k=0;k<rows.length;k++){ const {id,...b}=rows[k]; let tries=0; for(;;){ try { await C(c).doc(id).set(b); break; } catch(e){ if (e.code==='resource_exhausted' && tries++<6) { await new Promise(r=>setTimeout(r,1500*tries)); continue; } throw e; } } prog && prog(k+1); } } };
}
function supaBackend(){
  const T = () => sb.from('crm_docs');
  const chk = r => { if (r.error) throw r.error; return r.data; };
  return { kind:'supabase', okTxt:'Guardado en Supabase',
    set: async (c,id,b)=>chk(await T().upsert({owner:sbUser.id, col:c, id, data:b}, {onConflict:'owner,col,id'})),
    del: async (c,id)=>chk(await T().delete().eq('col',c).eq('id',id)),
    fotos: async ref => chk(await T().select('id,data').eq('col','fotos').eq('data->>ref', ref)).map(r=>({...r.data, id:r.id})),
    allFotos: async () => { const out=[]; for (let from=0;;from+=200){ const d=chk(await T().select('id,data').eq('col','fotos').range(from,from+199)); out.push(...d.map(r=>({...r.data,id:r.id}))); if (d.length<200) break; } return out; },
    bulk: async (c, rows, prog) => { for (let k=0;k<rows.length;k+=200){ const chunk=rows.slice(k,k+200).map(({id,...b})=>({owner:sbUser.id, col:c, id, data:b})); chk(await T().upsert(chunk,{onConflict:'owner,col,id'})); prog && prog(Math.min(rows.length,k+200)); } } };
}
async function supaLoadAll(){

  for (const c of COLS) applyRows(c, rows.filter(r=>r.col===c).map(r=>({...r.data, id:r.id})));
  COLS.forEach(c=>loaded[c]=true); mode='live'; setSync('ok','Conectado a Supabase · '+(sbUser.email||'')); render();
  if (!supaLoadAll._ch) supaLoadAll._ch = sb.channel('crm-docs').on('postgres_changes', {event:'*', schema:'public', table:'crm_docs'}, p => {
    const r = p.new && p.new.col ? p.new : p.old; if (!r || !r.col || r.col==='fotos' || !S[r.col]) { if (r && r.col==='fotos') GAL.invalidate(r.data && r.data.ref); return; }
    if (p.eventType==='DELETE') S[r.col]=S[r.col].filter(x=>x.id!==r.id);
    else { const o=norm(r.col,{...r.data, id:r.id}); const i=S[r.col].findIndex(x=>x.id===r.id); if (i>=0) S[r.col][i]=o; else S[r.col].push(o); }

}
async function initData(){
  if (window.__DEMO__) { mode='demo'; backend=demoBackend(); for (const c of COLS) { S[c]=(window.__DEMO__[c]||[]).map(o=>norm(c,{...o})); loaded[c]=true; } setSync('warn','Modo demostración'); render(); return; }
  if (window.claude && window.claude.use) {
    let timer = setTimeout(()=>{ if (mode==='loading') { setSync('warn','La base de datos no responde todavía'); render(); } }, 10000);
    try { db = await window.claude.use('db'); } catch(e){ db=null; }
    if (!db) { clearTimeout(timer); mode='offline'; setSync('bad','Sin base de datos'); render(); return; }
    backend = artifactBackend(db);
    for (const c of COLS) {
      db.collection(BASE+'/'+c).onSnapshot(snap => {
        applyRows(c, snap.docs.map(d => ({...d.data(), id:d.id})));
        if (!snap.metadata.fromCache) loaded[c]=true;
        if (COLS.every(k=>loaded[k])) { clearTimeout(timer); if (mode!=='live') { mode='live'; setSync('ok','Sincronizado en tiempo real'); } }
        scheduleRender();
      }, err => { clearTimeout(timer); mode='error'; setSync('bad', err.code==='revoked'?'Acceso retirado':'Error de conexión'); scheduleRender(); });
    }
    return;
  }
  // Fuera de Claude: Supabase
  if (!window.supabase || !window.supabase.createClient) { mode='offline'; setSync('bad','No se pudo cargar Supabase'); render(); return; }
  sb = window.supabase.createClient(SUPA.url, SUPA.key, {auth:{persistSession:true, autoRefreshToken:true}});
  backend = supaBackend();
  const { data } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev, session) => { if (ev==='SIGNED_OUT') { sbUser=null; mode='login'; COLS.forEach(c=>S[c]=[]); render(); } });
  if (data && data.session) { sbUser = data.session.user; try { await supaLoadAll(); } catch(e){ console.error(e); mode='error'; setSync('bad','Error al cargar'); render(); } }
  else { mode='login'; setSync('warn','Inicia sesión'); render(); }
}

/* ============ Metrics ============ */
function metrics(){
  const I = S.inmuebles, C = S.contactos;
  const g = id => I.filter(i=>grupoInm(i.estado)===id);
  const activos = I.filter(i=>['captado','publicado','reservado'].includes(grupoInm(i.estado)));
  const vendidos = g('vendido');
  const propias = vendidos.filter(i=>!i.vendidoPorPropietario);
  const cerrados = I.filter(i=>['vendido','archivado'].includes(grupoInm(i.estado)));
  const entrados = I.filter(i=>grupoInm(i.estado)!=='captacion' || true);
  const captados = I.filter(i=>grupoInm(i.estado)!=='captacion');
  const tiempos = propias.map(i=>({i, d:days(i.firma||i.alta, i.fEscritura)})).filter(x=>x.d!=null && x.d>=0);
  const tReserva = propias.map(i=>days(i.firma||i.alta, i.fReserva)).filter(x=>x!=null && x>=0);
  const avg = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;
  const ganados = C.filter(c=>String(c.estado).startsWith('7'));
  const perdidos = C.filter(c=>String(c.estado).startsWith('8'));
  const trabajados = C.filter(c=>c.estado && !String(c.estado).startsWith('1'));
  const vencI = I.filter(i=>i.fechaProx && i.fechaProx<=todayISO && !['vendido','archivado'].includes(grupoInm(i.estado)));
  const vencC = C.filter(c=>c.fechaProx && c.fechaProx<=todayISO);
  const vencO = S.operaciones.filter(o=>o.fechaProx && o.fechaProx<=todayISO && !['Ganada','Perdida'].includes(o.etapa));
  const encargos = activos.filter(i=>i.finEncargo).map(i=>({i,d:days(TODAY,i.finEncargo)})).filter(x=>x.d<=30).sort((a,b)=>a.d-b.d);
  const preavisos = activos.filter(i=>i.fechaPreaviso).map(i=>({i,d:days(TODAY,i.fechaPreaviso)})).filter(x=>x.d>=0 && x.d<=30).sort((a,b)=>a.d-b.d);
  const opsAbiertas = S.operaciones.filter(o=>!['Ganada','Perdida'].includes(o.etapa));
  return {
    total:I.length, activos, vendidos, propias, cerrados, captados, entrados,
    carteraValor: activos.reduce((s,i)=>s+(+i.precio||0),0),
    carteraHon: activos.reduce((s,i)=>s+honorarios(i),0),
    honVendidos: propias.reduce((s,i)=>s+honorarios(i),0),
    tasaCierre: cerrados.length ? propias.length/cerrados.length : null,
    tasaCaptacion: I.length ? captados.length/I.length : null,
    tiempoMedio: avg(tiempos.map(x=>x.d)), tiempos, tiempoReserva: avg(tReserva),
    contactos:C.length, ganados, perdidos, trabajados,
    tasaLeads: C.length ? ganados.length/C.length : null,
    tasaContacto: C.length ? trabajados.length/C.length : null,
    calientes: C.filter(c=>c.temperatura==='Caliente'),
    vencI, vencC, vencO, encargos, preavisos, opsAbiertas,
    honJuego: opsAbiertas.reduce((s,o)=>s+(+o.honEur||((+o.precioOferta||0)*(+o.honPct||0))),0),
    honPond: opsAbiertas.reduce((s,o)=>s+((+o.honEur||((+o.precioOferta||0)*(+o.honPct||0)))*(+o.probabilidad||0)),0)
  };
}

/* ============ Charts (HTML/SVG) ============ */
function barsHTML(rows, opts={}){
  const max = Math.max(1, ...rows.map(r=>r.v));
  if (!rows.length) return `<div class="empty">Sin datos todavía</div>`;
  return `<div class="bars ${opts.cls||''}">` + rows.map(r => `
    <div class="bar" data-tip="${esc(r.tip||(r.t+': '+(opts.fmt?opts.fmt(r.v):r.v)))}" ${r.go?`data-open="${r.go}"`:''} style="${r.go?'cursor:pointer':''}">
      <div class="t" title="${esc(r.t)}">${esc(r.t)}</div>
      <div class="track"><div class="fill" style="width:${Math.max(r.v?1.5:0, r.v/max*100)}%;background:${r.c||'var(--s1)'}"></div>${opts.avg!=null?`<div style="position:absolute;top:-3px;bottom:-3px;left:${opts.avg/max*100}%;border-left:2px dashed var(--ink-3)"></div>`:''}</div>
      <div class="v">${opts.fmt?opts.fmt(r.v):r.v}</div>
    </div>`).join('') + `</div>`;
}
function ringHTML(value, label, sub, color='var(--s1)'){
  const r=38, c=2*Math.PI*r, v = value==null?0:Math.max(0,Math.min(1,value));
  return `<div class="ring"><svg width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="${esc(label)} ${pct(value)}">
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
    ${v>0?`<circle cx="48" cy="48" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 48 48)"/>`:''}
    <text x="48" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">${value==null?'—':Math.round(v*100)+'%'}</text></svg>
    <div><div style="font-weight:600;font-size:14px">${label}</div><div style="font-size:12.5px;color:var(--ink-3);margin-top:3px">${sub}</div></div></div>`;
}

/* drag & drop for kanbans */
function bindDnD(){
  $$('[data-drag]').forEach(el => { el.ondragstart = e => { e.dataTransfer.setData('text/plain', el.dataset.drag); el.style.opacity=.5; }; el.ondragend = () => el.style.opacity=1; });
  $$('.col').forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add('drop'); };
    col.ondragleave = () => col.classList.remove('drop');
    col.ondrop = e => { e.preventDefault(); col.classList.remove('drop'); const ref=e.dataTransfer.getData('text/plain'); dropTo(ref, col.dataset); };
  });
}
function dropTo(ref, ds){
  const [t,id] = ref.split(':');
  if (t==='I' && ds.dropG) { const i=findInm(id); if (!i || grupoInm(i.estado)===ds.dropG) return; const n={...i, estado:grupoOf(ds.dropG).def};
    if (ds.dropG==='reservado' && !n.fReserva) n.fReserva=todayISO; if (ds.dropG==='vendido' && !n.fEscritura) n.fEscritura=todayISO; if (ds.dropG==='captado' && !n.firma) n.firma=todayISO;
    save('inmuebles', n); toast(`${i.direccion} → ${grupoOf(ds.dropG).t}`); }
  if (t==='C' && ds.dropE) { const c=findCon(id); if (!c || c.estado===ds.dropE) return; save('contactos', {...c, estado:ds.dropE, ultInteraccion:todayISO}); toast(`${nombreC(c)} → ${estLabel(ds.dropE)}`); }
  if (t==='O' && ds.dropO) { const o=S.operaciones.find(x=>x.id===id); if (!o || o.etapa===ds.dropO) return; save('operaciones', {...o, etapa:ds.dropO}); toast(`${o.id} → ${estLabel(ds.dropO)}`); }
}

function vAgenda(){

  for (const c of S.contactos) if (c.fechaProx) items.push({d:c.fechaProx, t:c.proxAccion||'Seguimiento', s:nombreC(c), go:'C:'+c.id, k:'Contacto'});
  for (const o of S.operaciones) if (o.fechaProx && !['Ganada','Perdida'].includes(o.etapa)) items.push({d:o.fechaProx, t:o.proxAccion||'Operación', s:o.id, go:'O:'+o.id, k:'Operación'});
  for (const a of S.actividad) if (a.fechaProx && !findCon(a.contactoId) && !findInm(a.inmuebleId)) items.push({d:a.fechaProx, t:a.proximo||'Próximo paso', s:(findCon(a.contactoId)?nombreC(findCon(a.contactoId)):'')+(a.inmuebleId?' · '+a.inmuebleId:''), go:'A:'+a.id, k:'Actividad'});
  for (const r of S.rutas) if (r.fecha>=todayISO) items.push({d:r.fecha, t:`Ruta: ${r.paradas?.length||0} paradas`, s:r.nombre||'Ruta de visitas', go:'R:'+r.id, k:'Ruta'});
  items.sort((a,b)=>a.d.localeCompare(b.d));
  const groups = [['Vencidas', x=>x.d<todayISO],['Hoy', x=>x.d===todayISO],['Próximos 7 días', x=>x.d>todayISO && days(TODAY,x.d)<=7],['Más adelante', x=>days(TODAY,x.d)>7]];
  const acts = [...S.actividad].sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));

/* ============ Sheet (fichas) ============ */
let sheetRef = null, sheetEdit = false;
function openSheet(ref, edit=false){ sheetRef=ref; sheetEdit=edit || (/^[OA]:/.test(ref) ? true : false); $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); drawSheet(); }
function closeSheet(){ sheetRef=null; sheetEdit=false; $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
function refreshSheet(){ if (sheetRef && !sheetEdit) drawSheet(); }
$('#scrim').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key==='Escape') closeSheet(); });
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o && !e.target.closest('a')) { openSheet(o.dataset.open); return; }
  const n = e.target.closest('[data-new]'); if (n) newRecord(n.dataset.new);
});
function head(title, sub, extra=''){ return `<div class="sh-head">${extra}<div style="min-width:0"><h2>${title}</h2><p>${sub}</p></div><button class="x" data-close>${ic('x')}</button></div>`; }
function li(label, val){ return (val==null||val==='') ? '' : `<div class="it"><span>${label}</span><b>${val}</b></div>`; }
function drawSheet(){
  const el = $('#sheet'); const [t, id] = sheetRef.split(':');
  let html = '';
  if (t==='I') html = sheetEdit ? formInm(findInm(id)||{id, _new:true}) : sheetInm(findInm(id));
  else if (t==='C') html = sheetEdit ? formCon(findCon(id)||{id,_new:true}) : sheetCon(findCon(id));
  else if (t==='O') html = formOp(S.operaciones.find(o=>o.id===id)||{id,_new:true});
  else if (t==='A') html = formAct(S.actividad.find(a=>a.id===id)||{id,_new:true, ...(typeof sheetEdit==='object'?sheetEdit:{})});
  else if (t==='P') html = sheetEdit ? formPto(findPto(id)||{id,_new:true, ...(typeof sheetEdit==='object'?sheetEdit:{})}) : sheetPto(findPto(id));
  else if (t==='R') { closeSheet(); MAP.routeDate = id.replace('R-',''); location.hash='mapa'; return; }
  if (!html) { el.innerHTML = head('No encontrado','Este registro ya no existe'); }
  else el.innerHTML = html;
  $$('[data-close]', el).forEach(b=>b.onclick=closeSheet);
  bindSheet && bindSheet(el, t, id);
  if (!sheetEdit && ['I','C','P'].includes(t)) { GAL.mount(id); const h=$('[data-lbh]',el); if (h) h.onclick=()=>GAL.lightbox(id,0); }
}

function sheetInm(i){
  if (!i) return '';
  const g = grupoOf(grupoInm(i.estado)); const prop = i.propId && findCon(i.propId);
  const dEnc = i.finEncargo ? days(TODAY, i.finEncargo) : null;
  const ev = [['Alta en cartera',i.alta],['Firma del encargo',i.firma],['Reserva',i.fReserva],['Arras',i.fArras],['Escritura',i.fEscritura]];
  const acts = S.actividad.filter(a=>a.inmuebleId===i.id).sort((a,b)=>String(b.fecha).localeCompare(a.fecha));
  const ops = S.operaciones.filter(o=>o.inmuebleId===i.id);
  const gm = 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((i.direccion||'')+', '+(i.municipio||'')+', España');
  const carac = [['Tipo',i.tipo],['Operación',i.operacion],['m² construidos',i.m2c],['m² útiles',i.m2u],['m² parcela',i.m2p],['Dormitorios',i.dorm],['Baños',i.banos],['Planta',i.planta],['Ascensor',i.ascensor],['Garaje',i.garaje],['Terraza / jardín',i.terraza],['Piscina',i.piscina],['Conservación',i.conservacion],['Año',i.anio],['Cert. energético',i.cee],['Ref. catastral',i.refCatastral]].map(([a,b])=>li(a,esc(b))).join('');

function submit(f, t, id){

    const n={...prev, ...v, id}; if (v.honEur!=null) { n.honEurManual=true; } else { n.honEurManual=false; n.honEur = n.precio && n.honPct ? Math.round(n.precio*n.honPct) : undefined; } if (v.lat!=null && v.lat!==prev.lat) n.geoAprox=false; if (!n.direccion) return toast('Falta la dirección');

  if (t==='C') { const prev=findCon(id)||{alta:todayISO}; const n={...prev, ...v, id}; if (!n.nombre) return toast('Falta el nombre'); save('contactos', n); sheetEdit=false; drawSheet(); toast('Contacto guardado'); }
  if (t==='O') { const prev=S.operaciones.find(o=>o.id===id)||{}; v.inmuebleId=idOf(v.inmuebleId); v.contactoId=idOf(v.contactoId); if (v.honPct!=null) v.honPct=v.honPct/100; if (v.probabilidad!=null) v.probabilidad=v.probabilidad/100;
    const n={...prev,...v,id}; n.honEur = (n.precioCierre||n.precioOferta) && n.honPct ? Math.round((n.precioCierre||n.precioOferta)*n.honPct) : undefined; save('operaciones', n); closeSheet(); toast('Operación guardada'); }
  if (t==='A') { const sync=v._sync; delete v._sync; v.contactoId=idOf(v.contactoId); v.inmuebleId=idOf(v.inmuebleId); const n={...(S.actividad.find(a=>a.id===id)||{}), ...v, id}; save('actividad', n);
    if (sync) { const c=findCon(n.contactoId); if (c) save('contactos', {...c, ultInteraccion:n.fecha, ...(n.proximo?{proxAccion:n.proximo, fechaProx:n.fechaProx}:{}), ...(String(c.estado).startsWith('1')?{estado:'2. Contactado'}:{})});
      const i=findInm(n.inmuebleId); if (i) save('inmuebles', {...i, ultAccion:n.fecha, ...(n.proximo?{proxAccion:n.proximo, fechaProx:n.fechaProx}:{})}); }
    closeSheet(); toast('Actividad registrada'); }
  if (t==='P') { const prev=findPto(id)||{}; const n={...prev,...v,id}; if (!n.nombre) return toast('Falta el nombre'); if (n.lat==null||n.lng==null) return toast('Faltan coordenadas'); save('puntos', n); sheetEdit=false; drawSheet(); toast('Punto guardado'); }
}
function newRecord(kind, preset={}){
  if (kind==='inmueble') { const id=nextId('inmuebles','I-'); openSheet('I:'+id, true); }
  if (kind==='contacto') { const id=nextId('contactos','C-'); openSheet('C:'+id, true); }
  if (kind==='operacion') { openSheet('O:'+nextId('operaciones','OP-')); }
  if (kind==='actividad') { openSheet('A:'+nextId('actividad','A-'), preset); }
}

function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
async function compress(src, max, q, limit){
  const im = await loadImg(src); let w=im.naturalWidth, h=im.naturalHeight; const k=Math.min(1, max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,w,h); cx.drawImage(im,0,0,w,h);
  let out=cv.toDataURL('image/jpeg', q); while (limit && out.length>limit && q>0.35) { q-=0.08; out=cv.toDataURL('image/jpeg', q); }
  if (limit && out.length>limit) return compress(out, Math.round(max*0.8), 0.7, limit);
  return out;
}
const readFile = f => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });

    if (pts.length===1) return 'https://www.google.com/maps/dir/?api=1&destination='+a(pts[0])+'&travelmode=driving';
    return 'https://www.google.com/maps/dir/?api=1&origin='+a(pts[0])+'&destination='+a(pts[pts.length-1])+(pts.length>2?'&waypoints='+pts.slice(1,-1).map(a).join('%7C'):'')+'&travelmode=driving'; },
  inZone(){ const svg=$('#map'); if (!svg||!this.vb) return []; return this.points().filter(p=>{ const [x,y]=this.P(p.lat,p.lng); return x>=this.vb.x && x<=this.vb.x+this.vb.w && y>=this.vb.y && y<=this.vb.y+this.vb.h; }); },
  panelHTML(){
    const r=this.route(); const st=this.stats(r); const gm=this.gmaps(r);
    const tabs = `<div class="seg" id="rtabs" style="margin-top:10px"><button class="${this.tab==='ruta'?'on':''}" data-t="ruta">Ruta del día</button><button class="${this.tab==='zona'?'on':''}" data-t="zona">Puntos en pantalla</button></div>`;
    let body;
    if (this.tab==='zona') { const z=this.inZone(); const inR=new Set(r.paradas.map(p=>p.ref));
      body = z.length ? z.map(p=>`<div class="stop"><div class="sh"><span class="num" style="background:var(${CAPAS[p.capa].c})">${CAPAS[p.capa].g}</span><div style="min-width:0;cursor:pointer" data-focus="${p.ref}"><div class="ti">${esc(p.nombre)}</div><div class="ad">${esc(p.sub)}</div></div><div class="ctl"><button data-zadd="${p.ref}" title="Añadir a la ruta">${inR.has(p.ref)?'✓':'＋'}</button></div></div></div>`).join('') : '<div class="empty">Mueve o acerca el mapa para ver los puntos de una zona</div>';
    } else {
      body = r.paradas.length ? r.paradas.map((s,k)=>{ const o=refObj(s.ref); if(!o) return ''; const cap=CAPAS[o.capa];
        return `<div class="stop ${s.done?'done':''}"><div class="sh"><span class="num" style="background:var(${cap.c})">${k+1}</span><div style="min-width:0;cursor:pointer" data-focus="${s.ref}"><div class="ti">${esc(o.nombre)}</div><div class="ad">${cap.t} · ${esc(o.municipio||'')}</div></div>
          <div class="ctl"><button data-mv="${k}:-1" title="Subir">↑</button><button data-mv="${k}:1" title="Bajar">↓</button><button data-dn="${k}" title="Marcar visitado">${s.done?'↺':'✓'}</button><button data-rm="${k}" title="Quitar">✕</button></div></div>
          <div class="tasks">${(s.tareas||[]).map((t,j)=>`<label class="task ${t.ok?'ok':''}"><input type="checkbox" data-tk="${k}:${j}" ${t.ok?'checked':''}><span>${esc(t.t)}</span></label>`).join('')}</div>
          <div class="addtask"><input data-nt="${k}" placeholder="Añadir tarea o nota y pulsa Intro"></div>${s.nota?`<div class="tasks"><div class="task" style="color:var(--ink-3)">📝 ${esc(s.nota)}</div></div>`:''}</div>`; }).join('')
        : `<div class="empty">Toca un punto del mapa y pulsa «Añadir a ruta», o usa la pestaña «Puntos en pantalla» para añadir los de una zona.</div>`;
    }
    return `<div class="rp-head"><div style="display:flex;align-items:center;gap:8px"><h3>Planificador de ruta</h3><input type="date" id="rdate" value="${this.routeDate}" style="margin-left:auto;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface)"></div>${tabs}</div>
      <div class="rp-body">${body}</div>
      <div class="rp-foot"><div class="stat-row"><div><span>Paradas</span><b>${st.done}/${st.n}</b></div><div><span>Distancia aprox.</span><b>${num(st.km)} km</b></div><div><span>Tiempo est.</span><b>${st.min?Math.floor(st.min/60)+' h '+Math.round(st.min%60)+' min':'—'}</b></div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${st.n>2?`<button class="btn sm" id="ropt">⚡ Optimizar orden</button>`:''}${gm?`<a class="btn sm primary" href="${gm}" target="_blank" rel="noopener">${ic('route')}Abrir en Google Maps</a>`:''}${st.n?`<button class="btn sm" id="rclear" style="color:var(--bad)">Vaciar</button>`:''}</div>
        ${st.n>10?'<div style="font-size:11.5px;color:var(--ink-3)">Google Maps admite hasta 10 paradas por ruta: divide la ruta si tienes más.</div>':''}</div>`;
  },
  mutate(fn){ const r=JSON.parse(JSON.stringify(this.route())); fn(r); this.saveRoute(r); this.refresh(); },
  bindPanel(){
    const p=$('#rpanel'); const self=this;
    $$('#rtabs button',p).forEach(b=>b.onclick=()=>{ self.tab=b.dataset.t; self.refresh(); });
    const d=$('#rdate',p); d.onchange=()=>{ self.routeDate=d.value||todayISO; self.refresh(); };
    $$('[data-focus]',p).forEach(b=>b.onclick=()=>{ const o=refObj(b.dataset.focus); if(!o) return; self.sel=o.ref; const [x,y]=self.P(o.lat,o.lng); const w=Math.min(self.vb.w, 0.03*self.KX*1000); const asp=self.vb.h/self.vb.w; self.vb={x:x-w/2,y:y-w*asp/2,w,h:w*asp}; self.apply(); });
    $$('[data-zadd]',p).forEach(b=>b.onclick=()=>self.addStop(b.dataset.zadd));
    $$('[data-mv]',p).forEach(b=>b.onclick=()=>{ const [k,dlt]=b.dataset.mv.split(':').map(Number); self.mutate(r=>{ const j=k+dlt; if (j<0||j>=r.paradas.length) return; [r.paradas[k],r.paradas[j]]=[r.paradas[j],r.paradas[k]]; }); });
    $$('[data-rm]',p).forEach(b=>b.onclick=()=>self.mutate(r=>r.paradas.splice(+b.dataset.rm,1)));
    $$('[data-dn]',p).forEach(b=>b.onclick=()=>{ const k=+b.dataset.dn; const r0=self.route(); const s=r0.paradas[k]; self.mutate(r=>{ r.paradas[k].done=!r.paradas[k].done; });
      if (!s.done) { const pt=findPto(s.ref); if (pt) save('puntos', {...pt, ultVisita:self.routeDate, estado: pt.estado==='Sin visitar'?'Visitado':pt.estado}); const im=findInm(s.ref); if (im) save('inmuebles', {...im, ultAccion:self.routeDate}); } });
    $$('[data-tk]',p).forEach(b=>b.onchange=()=>{ const [k,j]=b.dataset.tk.split(':').map(Number); self.mutate(r=>{ r.paradas[k].tareas[j].ok=b.checked; }); });
    $$('[data-nt]',p).forEach(b=>b.onkeydown=e=>{ if (e.key==='Enter' && b.value.trim()) { const k=+b.dataset.nt, v=b.value.trim(); self.mutate(r=>{ (r.paradas[k].tareas ||= []).push({t:v, ok:false}); }); } });
    const o=$('#ropt',p); if (o) o.onclick=()=>self.mutate(r=>{ const objs=r.paradas.map(s=>({s,o:refObj(s.ref)})).filter(x=>x.o); const out=[objs.shift()]; while(objs.length){ const last=out[out.length-1].o; let bi=0,bd=1e9; objs.forEach((x,i)=>{ const dd=hav(last,x.o); if(dd<bd){bd=dd;bi=i;} }); out.push(objs.splice(bi,1)[0]); } r.paradas=out.map(x=>x.s); });
    const c=$('#rclear',p); if (c) c.onclick=()=>{ if (c.dataset.sure) self.mutate(r=>{ r.paradas=[]; }); else { c.dataset.sure=1; c.textContent='¿Vaciar? Pulsa otra vez'; } };
  }
};
function hav(a,b){ const R=6371, t=x=>x*Math.PI/180; const dLa=t(b.lat-a.lat), dLo=t(b.lng-a.lng); const h=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function vMapa(){
  const zone = MAP.ZONES;
  return `<div class="head" style="margin-bottom:14px"><div><h1>Mapa y rutas</h1><p>Propiedades, notarías y asesorías · planifica la ruta del día y lo que harás en cada parada</p></div>
    <div style="display:flex;gap:8px"><button class="btn" id="addPt">${ic('plus')}Añadir punto</button></div></div>
  <div class="mapwrap">
    <div class="card mapcard">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><g id="base"></g><path id="rline" class="route"/><g id="towns"></g><g id="pins"></g></svg>
      <div class="mapui"><div class="glass layers" id="layers"></div></div>
      <div class="zones glass">${Object.entries(zone).map(([k,z])=>`<button data-z="${k}" class="${MAP.zone===k?'on':''}">${z.t}</button>`).join('')}</div>
      <div class="zoomc glass"><button id="zin" aria-label="Acercar">+</button><button id="zout" aria-label="Alejar">−</button></div>
      <div class="pop glass" id="pop"></div>
    </div>
    <div class="card route-panel" id="rpanel"></div>
  </div>`;
}
after.mapa = () => {
  const svg=$('#map');
  const main = new Set(['11012','11015','11020','11027','11028','11031']);
  $('#base').innerHTML = (window.__CP__||[]).map(f=>`<path class="cp ${main.has(String(f.ine))?'hi':''}" d="${f.r.map(r=>'M'+r.map(p=>MAP.P(p[1],p[0]).map(v=>v.toFixed(1)).join(',')).join('L')+'Z').join('')}"/>`).join('');
  if (MAP.vb) MAP.apply(); else MAP.setZone(MAP.zone);
  MAP.refresh();
  $$('.zones button').forEach(b=>b.onclick=()=>MAP.setZone(b.dataset.z));
  const zoom = (f, cx, cy) => { const vb=MAP.vb; if (cx==null){cx=vb.x+vb.w/2; cy=vb.y+vb.h/2;} const nw=Math.max(8, Math.min(2000, vb.w*f)); const k=nw/vb.w; MAP.vb={x:cx-(cx-vb.x)*k, y:cy-(cy-vb.y)*k, w:nw, h:vb.h*k}; MAP.apply(); };
  $('#zin').onclick=()=>zoom(.6); $('#zout').onclick=()=>zoom(1/.6);
  const toSvg = (cx,cy) => { const r=svg.getBoundingClientRect(); return [MAP.vb.x+(cx-r.left)/r.width*MAP.vb.w, MAP.vb.y+(cy-r.top)/r.height*MAP.vb.h]; };
  svg.addEventListener('wheel', e => { e.preventDefault(); const [x,y]=toSvg(e.clientX,e.clientY); zoom(Math.exp(e.deltaY*0.0015), x, y); }, {passive:false});
  const ptrs = new Map(); let moved=false, pinch=null;
  svg.addEventListener('pointerdown', e => { svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false; if (ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}; } });
  svg.addEventListener('pointermove', e => { if (!ptrs.has(e.pointerId)) return; const p=ptrs.get(e.pointerId); const r=svg.getBoundingClientRect();
    if (ptrs.size===2 && pinch) { ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const [cx,cy]=toSvg((a.x+b.x)/2,(a.y+b.y)/2); zoom(pinch.d/d, cx, cy); pinch.d=d; moved=true; return; }
    const dx=e.clientX-p.x, dy=e.clientY-p.y; if (Math.abs(dx)+Math.abs(dy)>3) moved=true; MAP.vb.x-=dx/r.width*MAP.vb.w; MAP.vb.y-=dy/r.height*MAP.vb.h; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); MAP.apply(); });
  const up = e => { ptrs.delete(e.pointerId); if (ptrs.size<2) pinch=null;
    if (!moved && e.type==='pointerup') { const el=document.elementFromPoint(e.clientX,e.clientY); const pin=el&&el.closest&&el.closest('[data-pin]');
      if (MAP.adding) { const [x,y]=toSvg(e.clientX,e.clientY); const [lat,lng]=MAP.U(x,y); MAP.adding=false; svg.classList.remove('adding'); openSheet('P:'+nextId('puntos', 'P-'), {lat:+lat.toFixed(5), lng:+lng.toFixed(5), capa:'notaria', estado:'Sin visitar'}); return; }
      MAP.sel = pin ? pin.dataset.pin : null; MAP.drawPins(); MAP.placePop(); } };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  $('#addPt').onclick=()=>{ MAP.adding=true; svg.classList.add('adding'); toast('Toca en el mapa donde está el nuevo punto'); };
  if (!after.mapa._rs) { after.mapa._rs=true; window.addEventListener('resize', ()=>{ if (route==='mapa' && MAP.vb){ const s=$('#map'); MAP.vb.h=MAP.vb.w*(s.clientHeight/Math.max(1,s.clientWidth)); MAP.apply(); } }); }
};

/* ============ View: Ajustes ============ */
function vAjustes(){
  const kind = backend ? backend.kind : 'ninguna';
  const where = {claude:'Base de datos privada de Claude (artefacto)', supabase:'Supabase · proyecto crm-inmobiliario', demo:'Modo demostración (sin guardar)', ninguna:'Sin conexión'}[kind];
  const n = c => S[c].length;
  return `<div class="head"><div><h1>Ajustes</h1><p>Conexión, copias de seguridad e importación de datos</p></div></div>
  <div class="grid k2">
    <div class="card panel"><h3>Conexión</h3><p class="desc">Dónde se guardan tus datos</p>
      <div class="list">${li('Base de datos', where)}${sbUser?li('Usuario', esc(sbUser.email)):''}${li('Inmuebles', n('inmuebles'))}${li('Contactos', n('contactos'))}${li('Puntos del mapa', n('puntos'))}${li('Operaciones', n('operaciones'))}${li('Actividades', n('actividad'))}${li('Rutas', n('rutas'))}</div>
      ${sbUser?`<div style="margin-top:14px"><button class="btn" id="logout">Cerrar sesión</button></div>`:''}
      <div style="margin-top:14px"><button class="btn sm" id="themeBtn2">◐ Cambiar tema claro / oscuro</button></div></div>
    <div class="card panel"><h3>Copia de seguridad</h3><p class="desc">Descarga todos tus datos en un archivo JSON o recupéralos desde uno. Sirve también para pasar los datos de una versión del CRM a otra.</p>
      <div style="display:flex;flex-direction:column;gap:10px">
        <label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="exFotos" checked> Incluir las fotos (el archivo será más grande)</label>
        <div><button class="btn primary" id="exBtn">Exportar copia (JSON)</button></div>
        <div style="border-top:1px solid var(--line-2);margin:6px 0"></div>
        <div><label class="btn" style="cursor:pointer">Importar copia (JSON)<input type="file" accept="application/json,.json" id="imFile" hidden></label></div>
        <div style="font-size:12px;color:var(--ink-3)">Al importar se añaden los registros nuevos y se actualizan los que tienen el mismo ID. No se borra nada.</div>
        <div id="imProg" style="font-size:12.5px;color:var(--ink-2)"></div></div></div>
  </div>`;
}
after.ajustes = () => {
  const lo=$('#logout'); if (lo) lo.onclick=async()=>{ await sb.auth.signOut(); };
  $('#themeBtn2').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
  $('#exBtn').onclick=async()=>{
    const b=$('#exBtn'); b.disabled=true; b.textContent='Preparando…';
    try {
      const out={app:'crm-carlos-fuster', version:1, exportado:new Date().toISOString()}; for (const c of COLS) out[c]=S[c].map(o=>({...o}));
      if ($('#exFotos').checked && backend) out.fotos = await backend.allFotos();
      const json=JSON.stringify(out); const name=`crm-copia-${todayISO}.json`;
      let done=false;
      if (window.claude && window.claude.use) { const dl=await window.claude.use('downloads'); if (dl) { await dl.save({filename:name, data:json}); done=true; } }
      if (!done) { const url=URL.createObjectURL(new Blob([json],{type:'application/json'})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); }
      toast('Copia exportada');
    } catch(e){ console.error(e); toast('No se pudo exportar'); }
    b.disabled=false; b.textContent='Exportar copia (JSON)';
  };
  $('#imFile').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return; const pr=$('#imProg');
    let data; try { data=JSON.parse(await f.text()); } catch(err){ pr.textContent='El archivo no es un JSON válido.'; return; }
    if (!backend) { pr.textContent='Sin conexión a la base de datos.'; return; }
    try {
      for (const c of [...COLS,'fotos']) { const rows=(data[c]||[]).filter(r=>r && r.id).map(r=>strip(r)); if (!rows.length) continue;
        pr.textContent=`Importando ${c}: 0 / ${rows.length}…`;
        await backend.bulk(c, rows, k=>{ pr.textContent=`Importando ${c}: ${k} / ${rows.length}…`; });
        if (backend.kind!=='claude' && c!=='fotos') { for (const r of rows) { const i=S[c].findIndex(x=>x.id===r.id); const o=norm(c,{...r}); if(i>=0) S[c][i]=o; else S[c].push(o); } } }
      GAL.invalidate(); pr.textContent='✓ Importación completada.'; toast('Datos importados'); render();
    } catch(err){ console.error(err); pr.textContent='Error al importar: '+(err.message||err.code||err); }
  };
};

/* ============ Theme & boot ============ */
function applyTheme(t){ document.documentElement.dataset.theme=t; try{ localStorage.setItem('crm-theme',t); }catch(e){} }
(function(){ let t=null; try{ t=localStorage.getItem('crm-theme'); }catch(e){} applyTheme(t || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')); })();
$('#themeBtn').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
readHash(); render(); initData();
